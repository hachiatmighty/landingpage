<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude — Motion Reel</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script>
// Deterministic motion-graphics engine. renderFrame(f) is a pure function of the frame
// number, and every cut/transition is computed from the beat grid in timeline.js.
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, TAU = Math.PI * 2;
const { BEAT, BAR, FPS } = TL;
const C = { ink: '#0A0A0E', paper: '#F4F1EA', hot: '#FF4D1F', cool: '#3646FF', sun: '#FFC83D' };
const F_BLACK = 'IDBlack', F_BOLD = 'IDBold', F_MONO = 'JBMono', F_MONOB = 'JBMonoB';

// ---------------- math ----------------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (x, a, b) => clamp((x - a) / (b - a));
const fract = (x) => x - Math.floor(x);
const hash = (n) => fract(Math.sin(n * 12.9898 + 78.233) * 43758.5453);
const eOutExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const eInExpo = (t) => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10));
const eInOutExpo = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2);
const eOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const eInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eOutBack = (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const eInBack = (t, s = 1.70158) => (s + 1) * t * t * t - s * t * t;
const eOutElastic = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1);
const tri = (x) => 1 - Math.abs(fract(x) * 2 - 1);
function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function lastBefore(arr, t) { let r = -1e9; for (const k of arr) { if (k <= t + 1e-9) r = k; else break; } return r; }
const kickEnv = (t) => Math.exp(-(t - lastBefore(TL.kicks, t)) / 0.11);
const snareEnv = (t) => Math.exp(-(t - lastBefore(TL.snares, t)) / 0.06);

function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const font = (ctx, size, fam) => { ctx.font = `${size}px ${fam}`; };
function layout(ctx, str, tracking = 0) {
  let x = 0; const xs = [], ws = [];
  for (const ch of str) { const w = ctx.measureText(ch).width; xs.push(x); ws.push(w); x += w + tracking; }
  return { xs, ws, total: x - tracking };
}
const CAP = 0.727; // Inter cap height / em
const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=/<>';
function decode(str, p, salt) {
  let o = '';
  for (let i = 0; i < str.length; i++) {
    const th = i / str.length * 0.8;
    if (p > th + 0.2 || str[i] === ' ') o += p > th ? str[i] : ' ';
    else if (p > th) o += GLYPHS[Math.floor(hash(i * 7.1 + salt) * GLYPHS.length)];
    else o += ' ';
  }
  return o;
}

// ---------------- scene 0: intro ----------------
function sIntro(ctx, lt, lb, t) {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  const implode = eInExpo(prog(lb, 3.1, 4));
  // dot grid ripples in from the center on beat 2
  if (lb > 1.5) {
    ctx.fillStyle = C.paper;
    for (let gx = 0; gx <= 32; gx++) for (let gy = 0; gy <= 18; gy++) {
      const x = gx * 60, y = gy * 60, dx = x - CX, dy = y - CY, d = Math.hypot(dx, dy);
      const a = eOutBack(prog(lb, 1.6 + d / 1400, 2.1 + d / 1400), 3);
      if (a <= 0) continue;
      let bump = 0;
      for (const k of [2, 3]) { const w = (lb - k - d / 1500) / 0.45; if (w > 0 && w < 1) bump += Math.sin(w * Math.PI); }
      const px = x - dx * implode * 0.9, py = y - dy * implode * 0.9;
      const r = 2.4 * a * (1 + bump * 1.6);
      ctx.globalAlpha = 0.28 + bump * 0.5;
      ctx.fillRect(px - r, py - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
  }
  // crosshair draws out on beat 1
  ctx.strokeStyle = C.paper; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5 * (1 - implode);
  const hl = eInOutExpo(prog(lb, 1, 1.6)) * CX, vl = eInOutExpo(prog(lb, 1.2, 1.8)) * CY;
  ctx.beginPath(); ctx.moveTo(CX - hl, CY); ctx.lineTo(CX + hl, CY); ctx.moveTo(CX, CY - vl); ctx.lineTo(CX, CY + vl); ctx.stroke();
  ctx.globalAlpha = 1;
  // ripple rings on every beat
  for (let k = 0; k < 4; k++) {
    const p = (lb - k) / 1.3;
    if (p <= 0 || p >= 1) continue;
    ctx.strokeStyle = k % 2 ? C.hot : C.paper; ctx.globalAlpha = (1 - p) * 0.9; ctx.lineWidth = 3 * (1 - p) + 0.5;
    ctx.beginPath(); ctx.arc(CX, CY, 16 + eOutExpo(p) * 330, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // loader arc
  const la = prog(lb, 0.4, 0.8) * (1 - prog(lb, 2.9, 3.15));
  if (la > 0) {
    const rot = lb * Math.PI * 1.4, len = (0.12 + 0.55 * (0.5 + 0.5 * Math.sin(lb * Math.PI * 1.3))) * TAU;
    ctx.strokeStyle = C.paper; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.globalAlpha = la;
    ctx.beginPath(); ctx.arc(CX, CY, 58, rot, rot + len); ctx.stroke(); ctx.globalAlpha = 1; ctx.lineCap = 'butt';
  }
  // the dot: pops in, pulses on each beat, anticipates, then swallows the frame
  let r = 11 * eOutBack(prog(lb, 0, 0.35), 3);
  for (let k = 0; k < 4; k++) if (lb >= k) r += 9 * Math.exp(-(lb - k) * 7);
  r *= 1 - 0.55 * eOutCubic(prog(lb, 3, 3.3));
  r += eInExpo(prog(lb, 3.3, 4)) * 1200;
  ctx.fillStyle = C.hot; ctx.beginPath(); ctx.arc(CX, CY, r, 0, TAU); ctx.fill();
  // loading copy
  const ta = 1 - prog(lb, 2.9, 3.2);
  if (ta > 0) {
    font(ctx, 20, F_MONO); ctx.textAlign = 'center'; ctx.fillStyle = C.paper; ctx.globalAlpha = ta;
    const pct = String(Math.floor(100 * eInOutCubic(prog(lb, 0.2, 3)))).padStart(3, '0');
    ctx.fillText(decode('LOADING SHOWREEL', prog(lb, 0.2, 1.2), Math.floor(t * 30)) + '  ' + pct + '%', CX, CY + 130);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
}

// ---------------- scene 1: title drop ----------------
let motionImg = null;
function sTitle(ctx, lt, lb, t) {
  const k = Math.floor(lb), u = lb - k;
  ctx.textBaseline = 'alphabetic';
  if (k === 0) {
    ctx.fillStyle = C.hot; ctx.fillRect(0, 0, W, H);
    const size = 400; font(ctx, size, F_BLACK);
    const L = layout(ctx, 'CLAUDE', -12), x0 = CX - L.total / 2, base = CY + size * CAP / 2;
    // echo outlines after landing
    const ep = prog(u, 0.35, 1);
    if (ep > 0) for (let e = 1; e <= 4; e++) {
      const s = 1 + e * 0.09 * eOutExpo(ep);
      ctx.save(); ctx.translate(CX, CY); ctx.scale(s, s); ctx.translate(-CX, -CY);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2 / s; ctx.globalAlpha = (1 - ep) * (0.6 - e * 0.12);
      ctx.strokeText('CLAUDE', x0, base); ctx.restore();
    }
    ctx.globalAlpha = 1; ctx.fillStyle = C.ink;
    [...'CLAUDE'].forEach((ch, i) => {
      const p = prog(u, i * 0.055, i * 0.055 + 0.45);
      if (p <= 0) return;
      const y = -900 * (1 - eOutBack(p, 2.2));
      const sq = Math.exp(-((p - 0.35) ** 2) / 0.01) * 0.18; // land squash
      ctx.save(); ctx.translate(x0 + L.xs[i] + L.ws[i] / 2, base + y);
      ctx.rotate((1 - p) ** 2 * 0.7 * (i % 2 ? 1 : -1)); ctx.scale(1 + sq, 1 - sq);
      ctx.fillText(ch, -L.ws[i] / 2, 0); ctx.restore();
    });
    if (u < 0.15) { ctx.fillStyle = C.paper; ctx.globalAlpha = (1 - u / 0.15) * 0.85; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  } else if (k === 1) {
    ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
    const size = 380;
    if (!motionImg) {
      const m = document.createElement('canvas').getContext('2d'); font(m, size, F_BLACK);
      const w = m.measureText('MOTION').width;
      motionImg = mk(Math.ceil(w) + 40, Math.ceil(size * 0.95));
      const g = motionImg.getContext('2d'); font(g, size, F_BLACK); g.fillStyle = C.paper;
      g.fillText('MOTION', 20, size * 0.95 / 2 + size * CAP / 2);
    }
    const iw = motionImg.width, ih = motionImg.height, x0 = CX - iw / 2, y0 = CY - ih / 2, n = 9, sh = ih / n;
    for (let j = 0; j < n; j++) {
      const p = eOutExpo(prog(u, j * 0.03, j * 0.03 + 0.5));
      const off = (j % 2 ? 1 : -1) * (1 - p) * 1500;
      ctx.drawImage(motionImg, 0, j * sh, iw, sh + 1, x0 + off, y0 + j * sh, iw, sh + 1);
    }
    const bw = eInOutExpo(prog(u, 0.25, 0.65)), bx = eInOutExpo(prog(u, 0.7, 1));
    ctx.fillStyle = C.hot; ctx.fillRect(x0 + 20 + (iw - 40) * bx, CY + 175, (iw - 40) * (bw - bx), 16);
  } else if (k === 2) {
    ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
    const size = 380; font(ctx, size, F_BLACK);
    const L = layout(ctx, 'DESIGN', -8), x0 = CX - L.total / 2, lh = size * 0.95;
    const hp = eInOutExpo(prog(u, 0.05, 0.45));
    ctx.fillStyle = C.sun; ctx.fillRect(x0 - 20, CY + 10, (L.total + 40) * hp, size * 0.36);
    ctx.fillStyle = C.ink;
    [...'DESIGN'].forEach((ch, i) => {
      const p = prog(u, i * 0.05, i * 0.05 + 0.55);
      const R = 7, s = eOutBack(p, 1.3) * (R - 1) * lh;
      ctx.save(); ctx.beginPath(); ctx.rect(x0 + L.xs[i] - 10, CY - lh / 2, L.ws[i] + 20, lh); ctx.clip();
      for (let r = 0; r < R; r++) {
        const y = CY - r * lh + s;
        if (y < CY - lh * 1.5 || y > CY + lh * 1.5) continue;
        const c = r === R - 1 ? ch : GLYPHS[Math.floor(hash(i * 13 + r) * 26)];
        const cw = ctx.measureText(c).width;
        ctx.fillText(c, x0 + L.xs[i] + (L.ws[i] - cw) / 2, y + size * CAP / 2);
      }
      ctx.restore();
    });
  } else {
    ctx.fillStyle = C.cool; ctx.fillRect(0, 0, W, H);
    const size = 300; font(ctx, size, F_BLACK);
    const word = 'SHOWREEL', L = layout(ctx, word, -6), x0 = CX - L.total / 2, base = CY + size * CAP / 2;
    // whip-zoom into the stem of the second "E" -> its paper fill becomes the next scene's background
    const ai = 5, ax = x0 + L.xs[ai] + size * 0.13, ay = CY;
    const zf = eInExpo(prog(u, 0.55, 1)), sc = 1 + zf * 45;
    ctx.save();
    ctx.translate(lerp(ax, CX, zf), lerp(ay, CY, zf)); ctx.scale(sc, sc); ctx.translate(-ax, -ay);
    const ep = prog(u, 0.12, 0.7);
    for (let e = 4; e >= 1; e--) {
      const s = 1 + e * 0.12 * eOutExpo(ep);
      ctx.save(); ctx.translate(CX, CY); ctx.scale(s, s); ctx.translate(-CX, -CY);
      ctx.strokeStyle = C.paper; ctx.lineWidth = 2.5 / s; ctx.globalAlpha = ep > 0 ? (1 - ep) * (0.7 - e * 0.13) : 0;
      ctx.strokeText(word, x0, base); ctx.restore();
    }
    ctx.globalAlpha = 1; ctx.fillStyle = C.paper;
    [...word].forEach((ch, i) => {
      const d = Math.abs(i - 3.5) * 0.045, s = eOutElastic(prog(u, d, d + 0.6));
      ctx.save(); ctx.translate(x0 + L.xs[i] + L.ws[i] / 2, CY); ctx.scale(s, s);
      ctx.fillText(ch, -L.ws[i] / 2, size * CAP / 2); ctx.restore();
    });
    font(ctx, 34, F_MONOB); ctx.fillStyle = C.sun;
    ctx.fillText(decode("— REEL '26 —", prog(u, 0.15, 0.5), Math.floor(t * 30)), x0 + 6, base + 70);
    ctx.restore();
  }
}

// ---------------- scene 2: form ----------------
const M = 220;
function radial(verts, a) {
  const dx = Math.cos(a), dy = Math.sin(a);
  for (let i = 0; i < verts.length; i++) {
    const p = verts[i], q = verts[(i + 1) % verts.length];
    const ex = q[0] - p[0], ey = q[1] - p[1], den = dx * ey - dy * ex;
    if (Math.abs(den) < 1e-9) continue;
    const tt = (p[0] * ey - p[1] * ex) / den, s = (p[0] * dy - p[1] * dx) / den;
    if (tt > 0 && s >= -1e-6 && s <= 1 + 1e-6) return tt;
  }
  return 1;
}
function polyV(n, rot, r, inner) {
  const v = [], m = inner ? n * 2 : n;
  for (let i = 0; i < m; i++) { const a = rot + i / m * TAU, rr = inner && i % 2 ? inner : r; v.push([Math.cos(a) * rr, Math.sin(a) * rr]); }
  return v;
}
const SHAPES = (() => {
  const defs = [null, polyV(4, Math.PI / 4, 1.22), polyV(3, -Math.PI / 2, 1.4), polyV(5, -Math.PI / 2, 1.38, 0.6)];
  return defs.map((v) => { const r = new Float32Array(M); for (let i = 0; i < M; i++) r[i] = v ? radial(v, i / M * TAU) : 1; return r; });
})();
const SHAPE_NAMES = ['CIRCLE', 'SQUARE', 'TRIANGLE', 'STAR'];
function shapeState(lb) {
  const k = clamp(Math.floor(lb), 0, 3), u = lb - k;
  const e = k === 0 ? 1 : eOutBack(prog(u, 0, 0.42), 2.2);
  const A = SHAPES[Math.max(0, k - 1)], Bs = SHAPES[k];
  let rot = 0; for (let j = 1; j <= 3; j++) rot += eOutBack(prog(lb, j, j + 0.45), 1.8) * Math.PI / 2;
  const w = Math.sin(u * TAU * 2) * Math.exp(-u * 6) * 0.22;
  let scale = k === 0 ? eOutElastic(prog(u, 0, 0.7)) : 1;
  scale *= 1 - eInBack(prog(lb, 3.72, 4), 2.5);
  return { A, Bs, e, rot, sx: (1 + w) * scale, sy: (1 - w) * scale };
}
function shapePath(ctx, st, R) {
  ctx.beginPath();
  for (let i = 0; i <= M; i++) {
    const j = i % M, a = j / M * TAU, r = lerp(st.A[j], st.Bs[j], st.e) * R;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    const rx = x * Math.cos(st.rot) - y * Math.sin(st.rot), ry = x * Math.sin(st.rot) + y * Math.cos(st.rot);
    if (i === 0) ctx.moveTo(CX + rx * st.sx, CY + ry * st.sy); else ctx.lineTo(CX + rx * st.sx, CY + ry * st.sy);
  }
  ctx.closePath();
}
function sForm(ctx, lt, lb, t) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  // background crosses: rotate on each beat as a wave from the center
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  for (let gx = 0; gx < 16; gx++) for (let gy = 0; gy < 9; gy++) {
    const x = 60 + gx * 120, y = 60 + gy * 120, d = Math.hypot(x - CX, y - CY);
    let a = 0; for (let j = 1; j <= 3; j++) a += eInOutCubic(prog(lb, j + d / 3500, j + d / 3500 + 0.4)) * Math.PI / 2;
    const s = 9 * (1 + 0.6 * kickEnv(t) * Math.max(0, 1 - d / 900)) * eOutBack(prog(lb, d / 4000, d / 4000 + 0.3));
    ctx.globalAlpha = 0.16;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(-s, 0); ctx.lineTo(s, 0); ctx.moveTo(0, -s); ctx.lineTo(0, s); ctx.stroke(); ctx.restore();
  }
  ctx.globalAlpha = 1;
  // orbit path + satellites (behind)
  const orb = (i) => { const a = t * 2.4 + i * TAU / 3; return { x: CX + Math.cos(a) * 470, y: CY + Math.sin(a) * 150 - Math.cos(a) * 60, z: Math.sin(a) }; };
  ctx.strokeStyle = C.ink; ctx.globalAlpha = 0.18; ctx.lineWidth = 1.5;
  ctx.beginPath(); for (let i = 0; i <= 80; i++) { const a = i / 80 * TAU; const x = CX + Math.cos(a) * 470, y = CY + Math.sin(a) * 150 - Math.cos(a) * 60; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
  ctx.globalAlpha = 1;
  const sat = (o, i) => { ctx.fillStyle = i === 0 ? C.cool : C.ink; const r = 11 + 6 * o.z; ctx.beginPath(); if (i === 1) ctx.rect(o.x - r, o.y - r, 2 * r, 2 * r); else ctx.arc(o.x, o.y, r, 0, TAU); ctx.fill(); };
  for (let i = 0; i < 3; i++) { const o = orb(i); if (o.z < 0) sat(o, i); }
  // echo trail (follow-through)
  for (let j = 6; j >= 1; j--) {
    const st = shapeState(Math.max(Math.floor(lb), lb - j * 0.055));
    shapePath(ctx, st, 250); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.globalAlpha = 0.5 - j * 0.07; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const st = shapeState(lb);
  shapePath(ctx, st, 250); ctx.fillStyle = C.hot; ctx.fill();
  // inner detail: a ring that counter-rotates
  ctx.save(); ctx.translate(CX, CY); ctx.rotate(-st.rot * 1.5);
  ctx.strokeStyle = C.paper; ctx.lineWidth = 3; ctx.setLineDash([14, 12]);
  ctx.beginPath(); ctx.arc(0, 0, 90 * Math.min(st.sx, st.sy), 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  for (let i = 0; i < 3; i++) { const o = orb(i); if (o.z >= 0) sat(o, i); }
  // annotation callout
  const k = clamp(Math.floor(lb), 0, 3), u = lb - k, la = (1 - prog(lb, 3.6, 3.8));
  const lx = CX + 300, ly = CY - 300, ex = CX + 180, ey = CY - 180;
  ctx.globalAlpha = la; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
  const lp = eOutExpo(prog(u, 0.05, 0.4));
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(lerp(ex, lx, lp), lerp(ey, ly, lp)); if (lp >= 1) ctx.lineTo(lx + 260 * eOutExpo(prog(u, 0.3, 0.6)), ly); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(ex, ey, 5, 0, TAU); ctx.fill();
  font(ctx, 20, F_MONOB); ctx.fillText(decode(`SHAPE_0${k + 1} / ${SHAPE_NAMES[k]}`, prog(u, 0.3, 0.7), Math.floor(t * 30)), lx, ly - 14);
  font(ctx, 16, F_MONO); ctx.globalAlpha = la * 0.6;
  ctx.fillText(decode('ease: back(2.2) · 0.42 beat', prog(u, 0.4, 0.8), Math.floor(t * 30) + 5), lx, ly + 26);
  ctx.globalAlpha = 1;
}

// ---------------- scene 3: particles ----------------
const PN = 2400;
const P = (() => {
  const r = mulberry(7);
  const sphere = new Float32Array(PN * 3), torus = new Float32Array(PN * 3), helix = new Float32Array(PN * 3);
  const jit = new Float32Array(PN * 3), delay = new Float32Array(PN), grp = new Uint8Array(PN);
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < PN; i++) {
    const y = 1 - (i / (PN - 1)) * 2, rr = Math.sqrt(1 - y * y), th = ga * i;
    sphere.set([Math.cos(th) * rr * 340, y * 340, Math.sin(th) * rr * 340], i * 3);
    const u = r() * TAU, v = r() * TAU;
    torus.set([(330 + 120 * Math.cos(v)) * Math.cos(u), 120 * Math.sin(v), (330 + 120 * Math.cos(v)) * Math.sin(u)], i * 3);
    const hy = (i / PN - 0.5) * 900, strand = i % 2, rung = i % 10 === 0;
    const ang = hy * 0.011 + strand * Math.PI;
    if (rung) { const s = r() * 2 - 1; helix.set([Math.cos(ang) * 190 * s, hy, Math.sin(ang) * 190 * s], i * 3); }
    else helix.set([Math.cos(ang) * 190 + (r() - 0.5) * 18, hy + (r() - 0.5) * 10, Math.sin(ang) * 190 + (r() - 0.5) * 18], i * 3);
    const jx = r() * 2 - 1, jy = r() * 2 - 1, jz = r() * 2 - 1, jl = Math.hypot(jx, jy, jz) || 1;
    jit.set([jx / jl, jy / jl, jz / jl], i * 3);
    delay[i] = r() * 0.22;
    const q = r(); grp[i] = q < 0.6 ? 0 : q < 0.78 ? 1 : 2;
  }
  return { sphere, torus, helix, jit, delay, grp };
})();
function waveAt(i, t, o) {
  const gx = i % 49, gz = Math.floor(i / 49) % 49;
  const x = (gx / 48 - 0.5) * 1000, z = (gz / 48 - 0.5) * 1000;
  o[0] = x; o[2] = z; o[1] = 90 * Math.sin(x * 0.011 + t * 5) * Math.cos(z * 0.009 - t * 3) + 60;
}
const PCOL = [C.hot, C.sun, C.paper];
function sParticles(ctx, lt, lb, t) {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  // label
  font(ctx, 18, F_MONO); ctx.fillStyle = C.paper;
  const names = ['SPHERE', 'TORUS', 'HELIX', 'FIELD'], k = clamp(Math.floor(lb), 0, 3), u = lb - k;
  let lx = CX - 330;
  names.forEach((n, i) => {

}
function sFinale(ctx, lt, lb, t) {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  // bookend: the intro dot grid returns, faintly
  ctx.fillStyle = C.paper;
  for (let gx = 0; gx <= 32; gx++) for (let gy = 0; gy <= 18; gy++) {
    const x = gx * 60, y = gy * 60, d = Math.hypot(x - CX, y - CY);
    const a = prog(lt, d / 2400, d / 2400 + 0.3);
    if (a <= 0) continue;
    const push = Math.exp(-((d - lt * 2200) ** 2) / 20000) * 18;
    ctx.globalAlpha = 0.1 * a + push / 60; const r = 2 + push * 0.15;
    ctx.fillRect(x + (x - CX) / (d || 1) * push - r / 2, y + (y - CY) / (d || 1) * push - r / 2, r, r);
  }
  ctx.globalAlpha = 1;
  // shockwaves
  for (let j = 0; j < 3; j++) { const p = prog(lt, j * 0.07, j * 0.07 + 1.1); if (p <= 0 || p >= 1) continue;
    ctx.strokeStyle = j === 1 ? C.paper : C.hot; ctx.globalAlpha = (1 - p) * 0.8; ctx.lineWidth = 14 * (1 - p);
    ctx.beginPath(); ctx.arc(CX, CY, eOutExpo(p) * 1250, 0, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1;
  // sparks
  ctx.lineCap = 'round';
  for (const s of SPARKS) {
    if (lt > s.life) continue;
    const [x, y] = sparkPos(s, lt), [x2, y2] = sparkPos(s, Math.max(0, lt - 0.025));
    ctx.strokeStyle = s.c; ctx.globalAlpha = 1 - lt / s.life; ctx.lineWidth = s.w;
    ctx.beginPath(); ctx.moveTo(CX + x2, CY + y2); ctx.lineTo(CX + x, CY + y); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
  // lockup
  const size = 250; font(ctx, size, F_BLACK);
  const L = layout(ctx, 'CLAUDE', -8), R = 128, gap = 70, total = R * 2 + gap + L.total;
  const mx = CX - total / 2 + R, wx = mx + R + gap, base = CY + size * CAP / 2 - 30;
  const settle = eOutExpo(prog(lb, 0, 1.2));
  mark(ctx, mx, CY - 30, R, prog(lb, 0, 1.4), -1.4 * (1 - settle) + lt * 0.25);
  [...'CLAUDE'].forEach((ch, i) => {
    const p = eOutExpo(prog(lb, 0.12 + i * 0.07, 0.12 + i * 0.07 + 0.7));
    ctx.save(); ctx.beginPath(); ctx.rect(wx + L.xs[i] - 20, base - size * CAP - 30, L.ws[i] + 40, size * CAP + 60); ctx.clip();
    ctx.fillStyle = C.paper; ctx.fillText(ch, wx + L.xs[i], base + (1 - p) * size * 1.05); ctx.restore();
  });
  const lp = eInOutExpo(prog(lb, 0.7, 1.5));
  ctx.fillStyle = C.hot; ctx.fillRect(wx + 4, base + 46, (L.total - 8) * lp, 5);
  font(ctx, 27, F_MONOB); ctx.fillStyle = C.paper;
  ctx.fillText(decode('MOTION DESIGN  ·  SHOWREEL 2026', prog(lb, 1.0, 2.2), Math.floor(t * 30)), wx + 4, base + 104);
  font(ctx, 18, F_MONO); ctx.globalAlpha = prog(lb, 2.0, 2.4);
  ctx.fillStyle = C.sun; ctx.beginPath(); ctx.arc(wx + 12, base + 158, 7 * (0.75 + 0.25 * Math.sin(t * 9)), 0, TAU); ctx.fill();
  ctx.fillStyle = C.paper; ctx.fillText(decode('AVAILABLE FOR NEW PROJECTS', prog(lb, 2.0, 2.9), Math.floor(t * 30) + 3), wx + 34, base + 164);
  ctx.globalAlpha = 1;
  if (lt < 0.1) { ctx.fillStyle = C.paper; ctx.globalAlpha = 1 - lt / 0.1; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

const SCENES = [sIntro, sTitle, sForm, sParticles, sType, sTunnel, sPrinciples, sBuild, sFinale];
function drawScene(ctx, t) {
  const bar = clamp(Math.floor(t / BAR + 1e-6), 0, 8), lt = t - bar * BAR;
  ctx.save(); ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  SCENES[bar](ctx, lt, lt / BEAT, t);
  ctx.restore();
}

// ---------------- post ----------------
const out = document.getElementById('c').getContext('2d');
const sceneC = mk(), sctx = sceneC.getContext('2d');
const accC = mk(), actx = accC.getContext('2d');
const tmpC = mk(), tctx = tmpC.getContext('2d');
const chC = mk(), chctx = chC.getContext('2d');
const bl1 = mk(320, 180), b1 = bl1.getContext('2d'), bl2 = mk(96, 54), b2 = bl2.getContext('2d');
const GRAIN = [0, 1, 2, 3].map((g) => { const c = mk(), x = c.getContext('2d'), id = x.createImageData(W, H), r = mulberry(500 + g);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - 0.5) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0); return c; });
const VIG = (() => { const c = mk(), x = c.getContext('2d'), g = x.createRadialGradient(CX, CY, 300, CX, CY, 1150);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.42)'); x.fillStyle = g; x.fillRect(0, 0, W, H); return c; })();
const BLOOM = [0.55, 0, 0, 0.9, 0.15, 0.7, 0, 0.6, 0.75];

function camera(t) {
  const bar = clamp(Math.floor(t / BAR + 1e-6), 0, 8), lt = t - bar * BAR;
  let shake = 0, ca = 0, zoom = 1;
  for (const ti of TL.impacts) if (t >= ti) { shake += 30 * Math.exp(-(t - ti) / 0.16); ca += 16 * Math.exp(-(t - ti) / 0.22); }
  if (bar >= 2 && bar <= 7) { shake += 10 * Math.exp(-lt / 0.08); ca += 7 * Math.exp(-lt / 0.1); }
  if (bar >= 1 && bar <= 6) { zoom += 0.014 * kickEnv(t); ca += 2.5 * kickEnv(t); }
  if (bar === 7) { const q = prog(lt, 0, BEAT * 3.5); shake += 2 + 12 * q * q + 6 * snareEnv(t) * q; ca += 1 + 9 * q * q; zoom += 0.05 * q * q; if (lt >= BEAT * 3.5) { shake = 0; ca = 0; zoom = 1; } }
  const n = t * 60;
  return { sx: (hash(Math.floor(n) * 1.3) - 0.5) * 2 * shake, sy: (hash(Math.floor(n) * 2.7 + 9) - 0.5) * 2 * shake,
    rot: (hash(Math.floor(n) * 4.1 + 3) - 0.5) * shake * 0.0009, zoom: zoom + shake / 700, ca, bloom: BLOOM[bar] };
}

function hud(ctx, t, f) {
  const bar = clamp(Math.floor(t / BAR + 1e-6), 0, 8), lt = t - bar * BAR, beat = Math.floor(t / BEAT + 1e-6) % 4;
  const inA = eOutExpo(prog(t, 0.0, 0.7));
  ctx.save(); ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
  // crop marks
  const L = 30 * inA; ctx.lineWidth = 2; ctx.beginPath();
  for (const [x, y, dx, dy] of [[40, 40, 1, 1], [W - 40, 40, -1, 1], [40, H - 40, 1, -1], [W - 40, H - 40, -1, -1]]) {
    ctx.moveTo(x + dx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * L); }
  ctx.stroke();
  ctx.globalAlpha = inA;
  font(ctx, 17, F_MONOB); ctx.fillText('CLAUDE', 70, 76);
  font(ctx, 17, F_MONO); ctx.fillText("/ MOTION REEL '26", 150, 76);
  // section label rolls in on each cut
  ctx.textAlign = 'right';
  const roll = eOutExpo(prog(lt, 0, BEAT * 0.5));
  ctx.save(); ctx.beginPath(); ctx.rect(W - 600, 52, 540, 32); ctx.clip();
  const lab = (b) => `${String(b).padStart(2, '0')} — ${TL.SECTIONS[b]}`;
  font(ctx, 17, F_MONOB);
  ctx.fillText(lab(bar), W - 70, 76 + (1 - roll) * 30);
  if (bar > 0) ctx.fillText(lab(bar - 1), W - 70, 76 - roll * 30);
  ctx.restore();
  // timecode
  ctx.textAlign = 'left'; font(ctx, 17, F_MONO);
  const ss = Math.floor(f / 60), ff = f % 60;
  ctx.fillText(`TC 00:00:${String(ss).padStart(2, '0')}:${String(ff).padStart(2, '0')}`, 70, H - 62);
  // bpm + beat indicator
  ctx.textAlign = 'right'; ctx.fillText(`${TL.BPM} BPM`, W - 70, H - 62);
  for (let b = 0; b < 4; b++) {
    const x = W - 250 + b * 22;
    if (b === beat) ctx.fillRect(x, H - 75, 14, 14); else ctx.strokeRect(x + 1, H - 74, 12, 12);
  }
  // progress
  ctx.globalAlpha = inA * 0.3; ctx.fillRect(70, H - 44, W - 140, 2);
  ctx.globalAlpha = inA; ctx.fillRect(70, H - 45, (W - 140) * (t / TL.DURATION), 4);
  for (let b = 1; b < 9; b++) ctx.fillRect(70 + (W - 140) * b / 9 - 1, H - 50, 2, 12);
  ctx.restore();
}

const SHUTTER = 0.55;
// whip moments (end-of-bar transitions) get many more motion-blur samples
const WHIP = { 0: 3.25, 1: 3.5, 2: 3.65, 3: 3.6, 4: 3.6, 5: 3.4 };
function subSamples(t) {
  const bar = Math.floor(t / BAR + 1e-6), lb = (t - bar * BAR) / BEAT;
  return WHIP[bar] !== undefined && lb >= WHIP[bar] ? 18 : 8;
}
function renderFrame(f) {
  const t = f / FPS;
  const beatStart = Math.floor(t / BEAT + 1e-6) * BEAT;
  const SUB = subSamples(t);
  for (let s = 0; s < SUB; s++) {
    let ts = (f - SHUTTER * (1 - s / (SUB - 1))) / FPS;
    if (ts < beatStart) ts = beatStart; // never smear across a cut
    sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.globalAlpha = 1; sctx.globalCompositeOperation = 'source-over';
    drawScene(sctx, ts);
    actx.globalAlpha = 1 / (s + 1); actx.drawImage(sceneC, 0, 0);
  }
  actx.globalAlpha = 1;
  const cam = camera(t);
  out.save();
  out.fillStyle = '#000'; out.fillRect(0, 0, W, H);
  out.translate(CX + cam.sx, CY + cam.sy); out.rotate(cam.rot); out.scale(cam.zoom, cam.zoom); out.translate(-CX, -CY);
  out.drawImage(accC, 0, 0);
  out.restore();
  if (cam.bloom > 0) {
    b1.drawImage(out.canvas, 0, 0, 320, 180); b2.drawImage(bl1, 0, 0, 96, 54);
    out.save(); out.globalCompositeOperation = 'screen'; out.imageSmoothingQuality = 'high';
    out.globalAlpha = cam.bloom * 0.55; out.drawImage(bl1, 0, 0, W, H);
    out.globalAlpha = cam.bloom * 0.6; out.drawImage(bl2, 0, 0, W, H); out.restore();
  }
  if (cam.ca > 0.6) {
    tctx.globalCompositeOperation = 'copy'; tctx.drawImage(out.canvas, 0, 0);
    out.save(); out.globalCompositeOperation = 'source-over'; out.fillStyle = '#000'; out.fillRect(0, 0, W, H);
    for (const [col, k] of [['#f00', 1], ['#0f0', 0.5], ['#00f', 0]]) {
      chctx.globalCompositeOperation = 'copy'; chctx.drawImage(tmpC, 0, 0);
      chctx.globalCompositeOperation = 'multiply'; chctx.fillStyle = col; chctx.fillRect(0, 0, W, H);
      const s = 1 + k * cam.ca / 960;
      out.globalCompositeOperation = 'lighter';
      out.setTransform(s, 0, 0, s, CX * (1 - s), CY * (1 - s)); out.drawImage(chC, 0, 0);
    }
    out.restore();
  }
  out.drawImage(VIG, 0, 0);
  out.save(); out.globalCompositeOperation = 'overlay'; out.globalAlpha = 0.07; out.drawImage(GRAIN[f % 4], 0, 0); out.restore();
  hud(out, t, f);
  return true;
}

window.ready = (async () => {
  const faces = [[F_BLACK, '/usr/share/fonts/opentype/inter/InterDisplay-Black.otf'], [F_BOLD, '/usr/share/fonts/opentype/inter/InterDisplay-Bold.otf'],
    [F_MONO, '/usr/share/fonts/truetype/jetbrains-mono/JetBrainsMono-Medium.ttf'], [F_MONOB, '/usr/share/fonts/truetype/jetbrains-mono/JetBrainsMono-Bold.ttf']];
  for (const [name, path] of faces) { const ff = new FontFace(name, `url(file://${path})`); await ff.load(); document.fonts.add(ff); }
  return true;
})();
window.renderFrame = renderFrame;
</script>
